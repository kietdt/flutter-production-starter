name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test-build:
    name: Analyze · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK (dev flavor)
        run: flutter build apk --debug -t lib/main_dev.dart
